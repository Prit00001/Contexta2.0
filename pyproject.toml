[project]
name = "contexta"
version = "2.0.0"
description = "Research question answering grounded in retrieved papers, with validated citations"
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies are managed in requirements.in (direct) -> requirements.txt (pinned lock).

# Vercel: the FastAPI app, dependencies from requirements.txt (vercel.json installCommand).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".cache", ".storage"]

[tool.ruff.lint]
# Correctness rules (pyflakes + pycodestyle errors), import sorting and flake8-bugbear (P2-FR-10).
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "app.deps.require_role"]

[tool.ruff.format]
# Legacy files not yet touched in Contexta 2.0. They are formatted (and removed from this list)
# the next time they are changed, so reviews never mix reformatting with behaviour changes.
exclude = [
    "app/routes_admin.py", "app/routes_workspace.py",
    "core/auth.py", "core/chunking.py", "core/parsers.py", "core/pdf.py",
    "core/text.py",
    "data/documents.py", "scripts/migrate.py",
    "services/arxiv_client.py", "services/ingestion.py", "services/worker.py",
    "services/workspace_qa.py",
    "tests/conftest.py", "tests/integration/test_ingestion_pipeline.py", "tests/integration/test_tenant_isolation.py",
    "tests/integration/test_workspace_api.py", "tests/test_api.py", "tests/test_generator.py", "tests/test_parsers.py",
]
