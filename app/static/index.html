<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contexta</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='14' r='8' fill='none' stroke='%234f46e5' stroke-width='3'/><path d='M20 20l7 7' stroke='%234f46e5' stroke-width='3' stroke-linecap='round'/></svg>">
  <style>
    :root {
      --bg: #fafafa;
      --field: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --accent: #4f46e5;
      --accent-ink: #ffffff;
      --accent-soft: #eef2ff;
      --err: #dc2626;
      --warn: #b45309;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #0c0c0e;
        --field: #141417;
        --ink: #ececef;
        --muted: #a1a1aa;
        --faint: #63636b;
        --line: #27272c;
        --accent: #a5b4fc;
        --accent-ink: #0c0c0e;
        --accent-soft: #1e1b3a;
        --err: #f87171;
        --warn: #fbbf24;
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 var(--font);
      -webkit-font-smoothing: antialiased
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(40px, 12vh, 112px) 16px 64px
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer
    }

    [hidden] {
      display: none !important
    }

    header {
      margin-bottom: 28px
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.015em;
      margin: 0
    }

    .lede {
      color: var(--muted);
      font-size: 15px;
      margin: 2px 0 0
    }

    /* composer */
    .box {
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: border-color .15s
    }

    .box:focus-within {
      border-color: var(--accent)
    }

    .box.drag {
      border-color: var(--accent);
      border-style: dashed;
      background: var(--accent-soft)
    }

    textarea {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      resize: none;
      padding: 14px 16px 4px;
      min-height: 54px;
      outline: none
    }

    textarea::placeholder {
      color: var(--faint)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 8px
    }

    .attach {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      color: var(--muted)
    }

    .attach:hover {
      color: var(--ink);
      background: var(--accent-soft)
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 60%;
      font-size: 13px;
      background: var(--accent-soft);
      color: var(--ink);
      border-radius: 8px;
      padding: 4px 6px 4px 10px
    }

    .chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .chip small {
      color: var(--muted);
      flex: none
    }

    .chip button {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      color: var(--muted);
      flex: none
    }

    .chip button:hover {
      color: var(--ink);
      background: var(--line)
    }

    .go {
      margin-left: auto;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      font-size: 14px;
      border-radius: 9px;
      padding: 8px 16px
    }

    .go:disabled {
      opacity: .5;
      cursor: progress
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      margin: 10px 4px 0;
      font-size: 13px;
      color: var(--muted)
    }

    .opts label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer
    }

    .opts input {
      accent-color: var(--accent);
      margin: 0
    }

    .opts select {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer
    }

    .try {
      margin-left: auto
    }

    .try button {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px
    }

    .try button:hover {
      color: var(--ink);
      text-decoration-color: currentColor
    }

    /* result */
    #out {
      margin-top: 44px
    }

    .status {
      font-size: 13px;
      color: var(--faint);
      margin: 0 0 12px
    }

    .answer {
      font-size: 17px;
      line-height: 1.7
    }

    .answer p {
      margin: 0 0 1em
    }

    .cite {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 4px;
      padding: 0 5px;
      margin: 0 1px;
      vertical-align: .2em;
      line-height: 1.5
    }

    .cite:hover {
      background: var(--accent);
      color: var(--accent-ink)
    }

    /* evidence: sentences without a citation, or that a claim check found unsupported */
    .claim.uncited {
      text-decoration: underline dotted var(--faint);
      text-underline-offset: 4px;
      cursor: help
    }

    .claim.unsupported {
      text-decoration: underline wavy var(--warn);
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      cursor: help
    }

    .evidence {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px
    }

    .evidence .flag {
      color: var(--warn)
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px
    }

    .err {
      color: var(--err);
      font-size: 15px;
      margin: 0
    }

    h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--faint);
      margin: 40px 0 4px
    }

    .srcs {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .src {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 0 8px;
      padding: 12px 8px;
      margin: 0 -8px;
      border-radius: 10px;
      border-top: 1px solid var(--line);
      transition: background .3s
    }

    .src:first-child {
      border-top: 0
    }

    .src.flash {
      background: var(--accent-soft)
    }

    .src .n {
      font-size: 13px;
      color: var(--faint);
      padding-top: 1px
    }

    .src .t {
      font-weight: 500;
      color: var(--ink);
      text-decoration: none
    }

    a.t:hover {
      color: var(--accent)
    }

    .src .meta {
      display: block;
      font-size: 13px;
      color: var(--muted)
    }

    .src details {
      margin-top: 4px;
      font-size: 14px
    }

    .src summary {
      cursor: pointer;
      color: var(--faint);
      font-size: 13px;
      list-style: none;
      width: fit-content
    }

    .src summary::-webkit-details-marker {
      display: none
    }

    .src summary:hover {
      color: var(--ink)
    }

    .src details p {
      margin: 6px 0 0;
      color: var(--muted)
    }

    .skel {
      height: 12px;
      border-radius: 6px;
      background: var(--line);
      margin: 0 0 12px;
      animation: pulse 1.2s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        opacity: .4
      }
    }

    footer {
      margin-top: 72px;
      font-size: 12px;
      color: var(--faint)
    }

    @media (max-width:480px) {
      .try {
        margin-left: 0;
        width: 100%
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .skel {
        animation: none
      }

      .src,
      .box {
        transition: none
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Contexta</h1>
      <p class="lede">Cited answers from ML/NLP papers, or from a PDF you upload.</p>
    </header>

    <form id="form">
      <div class="box" id="box">
        <textarea id="q" rows="2" maxlength="500" placeholder="Ask about machine learning or NLP…"
          aria-label="Your question" required></textarea>
        <div class="row">
          <button type="button" class="attach" id="attach" aria-label="Attach a PDF" title="Attach a PDF (max 4 MB)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path
                d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" />
            </svg>
          </button>
          <input type="file" id="file" accept="application/pdf,.pdf" hidden>
          <span class="chip" id="chip" hidden>
            <span id="chip-name"></span><small id="chip-size"></small>
            <button type="button" id="chip-x" aria-label="Remove PDF">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </span>
          <button class="go" id="go" type="submit">Ask</button>
        </div>
      </div>
      <div class="opts">
        <label id="arxiv-opt"><input type="checkbox" id="arxiv" checked> Live arXiv</label>
        <label>Sources <select id="k">
            <option>3</option>
            <option selected>5</option>
            <option>8</option>
          </select></label>
        <span class="try" id="examples">Try
          <button type="button">how RAG works</button> ·
          <button type="button">why LoRA is cheap</button>
        </span>
      </div>
    </form>

    <section id="out" aria-live="polite"></section>
    <footer id="foot"></footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const MAX_PDF = 4 * 1024 * 1024;
    const EXAMPLES = {
      'how RAG works': 'How does retrieval-augmented generation work?',
      'why LoRA is cheap': 'What makes LoRA cheaper than full fine-tuning?',
    };
    let pdf = null;

    /* ---------- PDF attach ---------- */
    const fmtSize = (b) => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

    function setPdf(f) {
      if (f) {
        const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
        if (!isPdf) return showError('Only PDF files are supported.');
        if (f.size > MAX_PDF) return showError(`That PDF is ${fmtSize(f.size)}. The limit is 4 MB.`);
      }
      pdf = f || null;
      $('chip').hidden = !pdf;
      $('attach').hidden = !!pdf;
      $('arxiv-opt').hidden = !!pdf;
      $('examples').hidden = !!pdf;
      if (pdf) { $('chip-name').textContent = pdf.name; $('chip-size').textContent = fmtSize(pdf.size); }
      $('q').placeholder = pdf ? 'Ask about this PDF…' : 'Ask about machine learning or NLP…';
      $('file').value = '';
      $('q').focus();
    }
    $('attach').onclick = () => $('file').click();
    $('file').onchange = (e) => setPdf(e.target.files[0]);
    $('chip-x').onclick = () => setPdf(null);

    const box = $('box');
    ['dragenter', 'dragover'].forEach((t) => box.addEventListener(t, (e) => { e.preventDefault(); box.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach((t) => box.addEventListener(t, (e) => { e.preventDefault(); box.classList.remove('drag'); }));
    box.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) setPdf(f); });

    /* ---------- input ---------- */
    $('examples').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      $('q').value = EXAMPLES[b.textContent] || b.textContent; $('form').requestSubmit();
    });
    $('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
    });

    /* ---------- rendering ---------- */
    function showError(msg) { $('out').innerHTML = `<p class="err">${esc(msg)}</p>`; }

    const citeBtn = (n, sources) => {
      const s = sources[n - 1];
      const label = s ? `Source ${n}: ${s.title}` : `Source ${n}`;
      return `<button type="button" class="cite" data-n="${n}" title="${esc(label)}" aria-label="${esc(label)}">${n}</button>`;
    };

    function renderAnswer(text, sources) {
      return esc(text).split(/\n{2,}/).map((p) =>
        '<p>' + p.replace(/\[(\d+)\]/g, (_, n) => citeBtn(+n, sources)) + '</p>'
      ).join('');
    }

    // Sentence-by-sentence from claims[]: flags uncited sentences and ones a claim check found unsupported.
    function renderClaims(d) {
      const html = d.claims.map((c) => {
        const cites = c.markers.map((n) => citeBtn(n, d.sources)).join('');
        let cls = '', why = '';
        if (c.status === 'uncited') {
          cls = ' uncited'; why = 'No citation: this sentence is not tied to a retrieved source.';
        } else if (c.support === 'not_supported') {
          cls = ' unsupported'; why = 'An AI check found the cited source does not back this sentence.';
        }
        const attrs = why ? ` title="${esc(why)}"` : '';
        return `<span class="claim${cls}"${attrs}>${esc(c.text)}</span>${cites ? ' ' + cites : ''}`;
      }).join(' ');
      return `<p>${html}</p>`;
    }

    function evidenceSummary(d) {  // returns HTML; every dynamic value is a number or escaped
      const cc = d.citation_check || {};
      const n = d.claims.length;
      if (!n || d.outcome === 'insufficient_evidence') return '';
      const cited = n - (cc.uncited_claims || 0);
      const parts = [cited === n ? 'Every sentence cites a source' : `${cited} of ${n} sentences cite a source`];
      if (cc.verification === 'claim_support') {
        const bits = [`${+cc.supported_claims || 0} supported`];
        if (cc.not_supported_claims) bits.push(`<span class="flag">${+cc.not_supported_claims} not supported</span>`);
        if (cc.unknown_claims) bits.push(`${+cc.unknown_claims} unchecked`);
        parts.push('AI claim check: ' + bits.join(', '));
      }
      const removed = (cc.removed_markers || []).map((m) => `[${+m}]`);
      if (removed.length) {
        const what = removed.length === 1 ? 'a citation to a source that was' : `${removed.length} citations to sources that were`;
        parts.push(`<span class="flag">removed ${what} never retrieved (${removed.join(' ')})</span>`);
      }
      return `<p class="evidence">${parts.join(' · ')}</p>`;
    }

    function sourceMeta(s) {
      if (s.source === 'pdf') return `Page ${s.page ?? '?'}`;
      const who = s.authors.length > 2 ? s.authors.slice(0, 2).join(', ') + ' et al.' : s.authors.join(', ');
      return [s.source === 'arxiv' ? 'arXiv' : 'Library', (s.published || '').slice(0, 4), who].filter(Boolean).join(' · ');
    }

    function render(d) {
      (d.diagnostics || []).forEach((m) => console.warn('[contexta]', m));
      const secs = ((d.timings_ms.total || 0) / 1000).toFixed(1) + 's';
      const model = (d.model_used || '').split('/').pop();
      const status = d.cached ? `${model} · cached`
        : d.llm_used ? `${model} · ${secs}`
          : `Quoted directly from sources (AI model unavailable) · ${secs}`;
      const sources = d.sources.map((s, i) => {
        const title = s.url
          ? `<a class="t" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`
          : `<span class="t">${esc(s.source === 'pdf' ? s.title.replace(/ · p\. \d+$/, '') : s.title)}</span>`;
        return `<li class="src" id="src-${i + 1}"><span class="n">${i + 1}</span><div>${title}
      <span class="meta">${esc(sourceMeta(s))}</span>
      ${s.snippet ? `<details><summary>Excerpt</summary><p>${esc(s.snippet)}</p></details>` : ''}</div></li>`;
      }).join('');
      $('out').innerHTML =
        `<p class="status">${esc(status)}</p>` +
        `<div class="answer">${d.claims && d.claims.length ? renderClaims(d) : renderAnswer(d.answer, d.sources)}</div>` +
        evidenceSummary(d) +
        (d.warnings || []).map((w) => `<p class="note">${esc(w)}</p>`).join('') +
        (sources ? `<h2>Sources</h2><ol class="srcs">${sources}</ol>` : '');
    }

    $('out').addEventListener('click', (e) => {
      const b = e.target.closest('.cite'); if (!b) return;
      const el = $('src-' + b.dataset.n); if (!el) return;
      const excerpt = el.querySelector('details'); if (excerpt) excerpt.open = true;  // [n] opens the cited passage
      el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
      el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
    });

    /* ---------- submit ---------- */
    async function errorMessage(r) {
      if (r.status === 429) return 'You are asking too quickly. Wait a minute, then try again.';
      if (r.status === 413) return 'That PDF is too large. The limit is 4 MB.';
      try {
        const body = await r.json();
        if (typeof body.detail === 'string') return body.detail;
        if (Array.isArray(body.detail)) return 'Please enter a question between 3 and 500 characters.';
      } catch (_) { /* non-JSON error page */ }
      return `Something went wrong (${r.status}). Try again in a moment.`;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = $('q').value.trim(); if (question.length < 3) return;
      const top_k = +$('k').value;
      $('go').disabled = true; $('go').textContent = pdf ? 'Reading…' : 'Searching…';
      $('out').innerHTML = '<div class="skel" style="width:92%"></div><div class="skel" style="width:84%"></div><div class="skel" style="width:58%"></div>';
      try {
        let r;
        if (pdf) {
          const fd = new FormData();
          fd.append('question', question); fd.append('top_k', top_k); fd.append('file', pdf);
          r = await fetch('/ask-pdf', { method: 'POST', body: fd });
        } else {
          r = await fetch('/ask', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, top_k, use_arxiv: $('arxiv').checked })
          });
        }
        if (!r.ok) throw new Error(await errorMessage(r));
        render(await r.json());
      } catch (err) {
        showError(err instanceof TypeError ? 'Could not reach the server. Check your connection and try again.' : err.message);
      } finally { $('go').disabled = false; $('go').textContent = 'Ask'; }
    });

    fetch('/health').then((r) => r.json()).then((h) => {
      $('foot').textContent = `${h.index_size} library papers · ` +
        (h.llm_providers.length ? h.llm_providers.join(' → ') : 'no AI model configured');
    }).catch(() => { });
  </script>
</body>

</html>
